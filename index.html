<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickNotes</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>

    <header>
        <h1>QuickNotes</h1>
        <p class="tagline">Jot down your thoughts, organised by category.</p>
    </header>

    <main>

        <!-- Add a note section -->
        <section id="add-note-section">
            <h2>Add a note</h2>

            <form id="note-form">
                <div class="form-group">
                    <label for="note-input">Note</label>
                    <input
                        type="text"
                        id="note-input"
                        name="note-input"
                        placeholder="Type your note here..."
                        autocomplete="off"
                    >
                </div>

                <div class="form-group">
                    <label for="note-category">Category</label>
                    <select id="note-category" name="note-category">
                        <option value="Personal">Personal</option>
                        <option value="Work">Work</option>
                        <option value="Study">Study</option>
                    </select>
                </div>

                <button type="submit" id="add-note-btn">Add Note</button>
            </form>

            <p id="error-message"></p>
        </section>

        <!-- Your notes section -->
        <section id="notes-section">
            <h2>Your notes</h2>

            <input
                type="search"
                id="search-input"
                placeholder="Search notes..."
                autocomplete="off"
            >

            <p id="note-count"></p>

            <ul id="notes-list"></ul>
        </section>

    </main>

    <footer>
        <p>&copy; 2025 QuickNotes. Built for learning web development.</p>
    </footer>

</body>
</html>
